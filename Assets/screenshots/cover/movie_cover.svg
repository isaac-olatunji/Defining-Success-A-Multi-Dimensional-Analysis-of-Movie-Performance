<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1A2F4A"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E3A5F" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#dots)"/>

  <!-- Film strip decoration — left side -->
  <rect x="0" y="0" width="60" height="500" fill="#0A1520" opacity="0.8"/>
  <rect x="12" y="20"  width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="64"  width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="108" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="152" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="196" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="240" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="284" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="328" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="372" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="416" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="12" y="460" width="36" height="28" rx="3" fill="#1B2F45"/>

  <!-- Film strip decoration — right side -->
  <rect x="1540" y="0" width="60" height="500" fill="#0A1520" opacity="0.8"/>
  <rect x="1552" y="20"  width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="64"  width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="108" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="152" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="196" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="240" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="284" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="328" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="372" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="416" width="36" height="28" rx="3" fill="#1B2F45"/>
  <rect x="1552" y="460" width="36" height="28" rx="3" fill="#1B2F45"/>

  <!-- Gold accent top bar -->
  <rect x="80" y="52" width="160" height="3" fill="url(#accentGold)"/>

  <!-- Eyebrow -->
  <text x="80" y="44" font-family="'Courier New', monospace" font-size="16"
        fill="#C9A84C" letter-spacing="4">POWER BI · DATA VISUALISATION</text>

  <!-- Main title -->
  <text x="80" y="155" font-family="Georgia, 'Times New Roman', serif"
        font-size="88" font-weight="700" fill="#F4F6FA">Defining</text>
  <text x="80" y="255" font-family="Georgia, 'Times New Roman', serif"
        font-size="88" font-weight="700" fill="#F4F6FA">Success</text>

  <!-- Laurel wreath divider -->
  <text x="80" y="300" font-family="Arial" font-size="22" fill="#C9A84C">🏆</text>

  <!-- Subtitle -->
  <text x="116" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20"
        fill="#8DA3C4">A Multi-Dimensional Analysis of Movie Performance</text>

  <!-- Vertical divider -->
  <rect x="820" y="80" width="1" height="360" fill="#2A4A6A"/>

  <!-- Right side — metrics -->
  <g font-family="Arial, Helvetica, sans-serif">

    <!-- Metric 1 -->
    <text x="880" y="140" font-size="13" fill="#6B85AC" letter-spacing="2">DATASET</text>
    <text x="880" y="178" font-size="38" font-weight="700" fill="#C9A84C">1.4M+</text>
    <text x="880" y="200" font-size="14" fill="#6B85AC">Movie records analysed</text>

    <!-- Metric 2 -->
    <text x="880" y="250" font-size="13" fill="#6B85AC" letter-spacing="2">FINANCIALLY OBSERVABLE</text>
    <text x="880" y="288" font-size="38" font-weight="700" fill="#C9A84C">18K</text>
    <text x="880" y="310" font-size="14" fill="#6B85AC">Movies with full financial data</text>

    <!-- Metric 3 -->
    <text x="880" y="360" font-size="13" fill="#6B85AC" letter-spacing="2">FINANCIAL PROFIT GENERATED</text>
    <text x="880" y="398" font-size="38" font-weight="700" fill="#C9A84C">$563.55bn</text>
    <text x="880" y="420" font-size="14" fill="#6B85AC">Across profitable titles</text>

    <!-- Dashboard pages -->
    <text x="880" y="460" font-size="13" fill="#6B85AC" letter-spacing="2">DASHBOARD PAGES</text>
    <text x="880" y="490" font-size="14" fill="#8DA3C4">Defining Success · Commercial · Audience · The Verdict</text>
  </g>

  <!-- Author -->
  <text x="80" y="460" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#4A6184">isaactheanalyst</text>
  <text x="80" y="485" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#3A5070">TMDB Dataset · Power BI · Power Query · DAX</text>
</svg>
